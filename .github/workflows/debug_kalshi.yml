name: Debug Kalshi API

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Debug Kalshi API
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          KALSHI_BASE_URL: https://api.elections.kalshi.com/trade-api/v2
        run: |
          python - <<'EOF'
          import requests, json, os, time

          BASE = os.environ["KALSHI_BASE_URL"]
          KEY  = os.environ["KALSHI_API_KEY"]
          headers = {"Authorization": f"Bearer {KEY}", "Accept": "application/json"}

          def get(url, params=None):
              time.sleep(0.3)
              r = requests.get(url, headers=headers, params=params, timeout=15)
              try:
                  return r.status_code, r.json()
              except Exception:
                  return r.status_code, r.text[:300]

          # 1. Show ONE full KXNBAPTS market to see all fields
          print("\n=== KXNBAPTS — first market (FULL) ===")
          status, data = get(f"{BASE}/markets",
                             {"limit": 1, "status": "open", "series_ticker": "KXNBAPTS"})
          print(f"Status: {status}")
          if isinstance(data, dict) and data.get("markets"):
              print(json.dumps(data["markets"][0], indent=2))
          else:
              print(data)

          # 2. Count markets for each NBA player-prop series
          print("\n=== NBA player-prop series counts ===")
          for s in ["KXNBAPTS","KXNBAREB","KXNBAAST","KXNBA3PM",
                    "KXNBABLK","KXNBASTL","KXNBATO","KXNBAPRA","KXNBAPR","KXNBAPA"]:
              status, data = get(f"{BASE}/markets",
                                 {"limit": 3, "status": "open", "series_ticker": s})
              if isinstance(data, dict):
                  mkts = data.get("markets", [])
                  sample = mkts[0].get("ticker","—") if mkts else "—"
                  print(f"  {s:12s}: {len(mkts):3d} markets  | {sample}")
              else:
                  print(f"  {s:12s}: error {status}")

          EOF
